databaseChangeLog:
  - changeSet:
      id: add-index-student-name
      author: hogwarts
      changes:
        - createIndex:
            tableName: student
            indexName: idx_student_name
            columns:
              - column:
                  name: name

  - changeSet:
      id: add-index-faculty-name-color
      author: hogwarts
      changes:
        - createIndex:
            tableName: faculty
            indexName: idx_faculty_name_color
            columns:
              - column:
                  name: name
              - column:
                  name: color
